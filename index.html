<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff8f2">
<title>HP回復リザルト メッセージメーカー v1</title>
<style>
:root{--bg:#fff8f2;--card:#fff;--ink:#49382f;--muted:#8f7768;--line:#ead9cc;--orange:#ff9b32;--soft:#fff0df}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;color:var(--ink)}
.wrap{max-width:720px;margin:auto;padding:16px 14px 100px}
h1{font-size:22px;margin:4px 0}.sub{font-size:13px;color:var(--muted);line-height:1.6}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin:12px 0;box-shadow:0 5px 18px rgba(90,50,20,.05)}
h2{font-size:16px;margin:0 0 10px}
label{font-size:12px;font-weight:800;display:block;margin:7px 0 5px}
input,textarea{width:100%;font:inherit;font-size:16px;border:1px solid #e7d9cf;border-radius:12px;padding:10px;background:#fff;color:var(--ink)}
textarea{min-height:120px;resize:vertical}
button{border:0;border-radius:13px;padding:11px 13px;font-size:14px;font-weight:850;cursor:pointer}
.primary{background:var(--orange);color:white}.soft{background:var(--soft);color:#925716}.ghost{background:#f3f0ed;color:#5b4d45}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}
.top{border:1px solid var(--line);border-radius:14px;padding:10px;margin:8px 0}
.preview{min-height:600px;white-space:pre-wrap;line-height:1.55;font-family:ui-monospace,SFMono-Regular,Menlo,"Hiragino Sans",monospace;font-size:14px}
.note{font-size:12px;color:var(--muted);line-height:1.55}
.sticky{position:fixed;bottom:0;left:0;right:0;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:rgba(255,248,242,.94);backdrop-filter:blur(10px);border-top:1px solid var(--line)}
.sticky div{max-width:720px;margin:auto;display:flex;gap:8px}.sticky button{flex:1}
.badge{display:inline-block;background:#fff0df;color:#915817;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:800}
</style>
</head>
<body>
<div class="wrap">
<h1>🐰 HP回復リザルト メーカー</h1>
<div class="sub">まずは文章生成だけの基準版。OCRはまだ入れていません。名前を入れて、毎日のリザルト文章とランダムBONUS / STATUSを確認できます。</div>

<div class="card">
<h2>① 基本</h2>
<label>日付</label><input id="date" type="date">
</div>

<div class="card">
<h2>② ギフトランキング</h2>
<div class="note">上から1〜3位。TOP3だけBONUS GETが付きます。</div>
<div id="tops"></div>
<label>4位以下「ギフト届け隊」</label>
<textarea id="others" placeholder="1行に1人&#10;例：&#10;○○&#10;○○&#10;○○"></textarea>
</div>

<div class="card">
<h2>③ NEW RANK GET！</h2>
<div class="note">その日に新しくRankを獲得した人だけ。Rank.2以降も入ります。</div>
<textarea id="ranks" placeholder="名前,1&#10;名前,2&#10;名前,3"></textarea>
</div>

<div class="card">
<h2>④ 今日のランダム結果 🎲</h2>
<div class="row">
<button class="soft" id="rerollBonus">TOP3 BONUSを引き直す</button>
<button class="soft" id="rerollStatus">STATUSを引き直す</button>
</div>
<div style="margin-top:10px"><span class="badge">かわいい70%・おもしろ25%・レア5%</span></div>
</div>

<div class="card">
<h2>⑤ 完成メッセージ</h2>
<textarea id="preview" class="preview"></textarea>
</div>
</div>

<div class="sticky"><div>
<button class="ghost" id="rerollAll">🎲 全部引き直す</button>
<button class="primary" id="copy">📋 全文コピー</button>
</div></div>

<script>
const $=s=>document.querySelector(s);
const bonusNormal=[
 ["🍮 ラッキーフード","プリン"],["🍮 ラッキーフード","グミ"],["🍮 ラッキーフード","アイス"],
 ["🎨 ラッキーカラー","ラベンダー"],["🎨 ラッキーカラー","みずいろ"],["🎨 ラッキーカラー","オレンジ"],
 ["🎧 ラッキーアイテム","イヤホン"],["🎧 ラッキーアイテム","ヘアゴム"],["🎧 ラッキーアイテム","小さいポーチ"],
 ["⏰ ラッキータイム","22:22"],["⏰ ラッキータイム","17:17"],["🎯 ラッキー行動","好きな曲を1曲聴く"],
 ["🎯 ラッキー行動","水を1杯飲む"],["🐰 ラッキーひとこと","今日はなんとかなる"],["🐰 ラッキーひとこと","自分に甘くてヨシ！"]
];
const bonusFunny=[
 ["📍 ラッキースポット","冷蔵庫の前"],["🎯 ラッキー行動","なんとなく右を選ぶ"],
 ["🔊 ラッキー効果音","ﾎﾟﾖﾝｯ"],["📏 ラッキー距離","3歩"],["🔢 ラッキー数字","14"]
];
const bonusRare=[
 ["✨ SUPER BONUS","今日はめちゃくちゃいい日"],["🐰 SUPER BONUS","なんか知らんけど大吉ｯ！"]
];
const hpNormal=["FULL！","MAX！","999 / 999","回復ｯ！"];
const hpFunny=["OVER！","回復しすぎ！","限界突破！"];
const statusNormal=["ごきげんうさぎ","にこにこ状態","明日もいけそう","とてもご機嫌です","ぴょんぴょん状態"];
const statusFunny=["元気になりすぎました","HPだだ余り","まだしゃべれます","なんか今日つよい","無敵ではないが元気","だいぶ生き生きしてる"];
const effectNormal=["明日のHP ＋1","ごきげん度 ＋5","笑う回数 ＋3","やる気 ＋1","なんとかなる感 ＋8","今日の思い出 ＋1"];
const effectFunny=["おしゃべり ＋10","話の脱線率 ＋30%","急な早口 ＋50%","謎の自信 ＋7","何かは分からんが ＋1","語彙力 −2"];
const rareStatus=["SUPER RARE！今日はめちゃくちゃいい日","SUPER RARE！みんなまとめてHP ＋1"];

let bonuses=[],status={};
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function weighted(normal,funny,rare){
 const r=Math.random();
 return r<.70?pick(normal):r<.95?pick(funny):pick(rare);
}
function rollBonuses(){bonuses=[0,1,2].map(()=>weighted(bonusNormal,bonusFunny,bonusRare));}
function rollStatus(){
 const rare=Math.random()<.05;
 status={
   hp: weighted(hpNormal,hpFunny,["OVER HEAL！"]),
   st: rare?pick(rareStatus):weighted(statusNormal,statusFunny,["今日はめちゃくちゃいい日"]),
   ef: weighted(effectNormal,effectFunny,["みんなまとめてHP ＋1"])
 };
}
function dateText(){
 const v=$("#date").value;if(!v)return "TODAY";
 const [y,m,d]=v.split("-"); return `${Number(m)} / ${Number(d)}`;
}
function topNames(){return [1,2,3].map(i=>$(`#top${i}`).value.trim()).filter(Boolean)}
function otherNames(){return $("#others").value.split(/\n/).map(x=>x.trim()).filter(Boolean)}
function rankRows(){
 return $("#ranks").value.split(/\n/).map(x=>x.trim()).filter(Boolean).map(line=>{
   const m=line.match(/^(.*?)[,，\s]+(?:Rank\.?)?([1-9]\d*)$/i);
   return m?{name:m[1].trim(),rank:m[2]}:{name:line,rank:"?"};
 });
}
function generate(){
 const tops=[1,2,3].map(i=>$(`#top${i}`).value.trim());
 const medals=["🥇","🥈","🥉"];
 let topBlock="";
 tops.forEach((name,i)=>{
   if(!name)return;
   const b=bonuses[i]||bonusNormal[0];
   topBlock+=`${medals[i]} ${name}\n　└ 🍀 BONUS GET！\n　　 ${b[0]}\n　　 【 ${b[1]} 】\n\n`;
 });
 const others=otherNames();
 const giftBlock=others.length?others.map(n=>`🎁⌇${n}`).join("\n"):"🎁⌇（4位以下なし）";
 const ranks=rankRows();
 const rankBlock=ranks.length?ranks.map(r=>`✨ ${r.name}　▶ Rank.${r.rank} GET！`).join("\n"):"（NEW RANKなし）";

 const msg=`╭──────────────╮
　🐰 HP回復リザルト 🐰
　　 ${dateText()} 配信終了ｯ！
╰──────────────╯

╭──────────────╮
　🎁 GIFT RECEIVED

　 ૮₍ ˶ᵔ ᵕ ᵔ˶ ₎აっ🎁
　　　ﾋﾟﾛﾘﾝｯ♪
　　❤️ HP ＋＋＋
╰──────────────╯

╭──────────────╮
　🏆 TODAY'S TOP3

${topBlock.trimEnd()}
╰──────────────╯

╭──────────────╮
　🎁 ｷﾞﾌﾄ届け隊のみなさま

${giftBlock}

　🎁⊂૮₍ ˶ᵔ ᵕ ᵔ˶ ₎ა⊃🎁

　ぜ〜んぶ受け取ったｯｯｯ♡
╰──────────────╯

╭──────────────╮
　🌷 NEW RANK GET！

${rankBlock}
╰──────────────╯

╭──────────────╮
　📟 TODAY'S STATUS

❤️ HP
【■■■■■■■■■■】${status.hp}

🐰 STATUS
【 ${status.st} 】

✨ EFFECT
【 ${status.ef} 】
╰──────────────╯

　　＼ ✨ QUEST CLEAR！✨ ／

　今日もしゅりのHPを
回復してくれてありがと〜ｯ！🌼

　 ૮₍ ˶ᵔ ᵕ ᵔ˶ ₎ა ♡
　　 また遊ぼうねｯ！`;
 $("#preview").value=msg;
}
for(let i=1;i<=3;i++){
 const d=document.createElement("div");d.className="top";
 d.innerHTML=`<label>${["🥇 1位","🥈 2位","🥉 3位"][i-1]}</label><input id="top${i}" placeholder="名前">`;
 $("#tops").appendChild(d);
}
const now=new Date();$("#date").value=new Date(now-now.getTimezoneOffset()*60000).toISOString().slice(0,10);
rollBonuses();rollStatus();generate();
document.querySelectorAll("input,textarea").forEach(e=>e.addEventListener("input",generate));
$("#date").addEventListener("change",generate);
$("#rerollBonus").onclick=()=>{rollBonuses();generate()};
$("#rerollStatus").onclick=()=>{rollStatus();generate()};
$("#rerollAll").onclick=()=>{rollBonuses();rollStatus();generate()};
$("#copy").onclick=async()=>{
 try{await navigator.clipboard.writeText($("#preview").value);$("#copy").textContent="✅ コピーした！";setTimeout(()=>$("#copy").textContent="📋 全文コピー",1000)}
 catch(e){$("#preview").select();document.execCommand("copy")}
};
</script>
</body>
</html>
